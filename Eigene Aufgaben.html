<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Text bearbeiten</title>
    <link rel="stylesheet" href="style.css">
    <style>
        textarea {
            resize: none;
        }
    </style>
</head>

<body>

    <h2>Meine eigene Aufgabe</h2>

    <textarea id="eingabe" placeholder="Text eingeben"></textarea>
    <br><br>

    <input type="text" id="neuText" placeholder="Neuen Text eingeben">
    <br><br>

    <button onclick="textLoeschen()">Text löschen</button>
    <button onclick="textKopieren()">Text kopieren</button>
    <button onclick="wortErsetzen()">Wort ersetzen</button>
    <button onclick="textLaenge()">Textlänge anzeigen</button>
    <button onclick="leerzeichenEntfernen()">Leerzeichen entfernen</button>

    <p id="ausgabe"></p>


    <script>
        // Hole große Textfeld
        let eingabe = document.getElementById("eingabe");

        // Hole kleine Textfeld
        let neuText = document.getElementById("neuText");

        // Hole Feld für  Ausgabe
        let ausgabe = document.getElementById("ausgabe");

        // ganzer text löschen
        function textLoeschen() {
            eingabe.value = "";
            ausgabe.innerHTML = "Der Text wurde gelöscht";
        }
        // Diese Funktion kopiert den Text
        function textKopieren() {
            navigator.clipboard.writeText(eingabe.value);
            ausgabe.innerHTML = "Der Text wurde kopiert";
        }

        // Diese Funktion ersetzt den ganzen Text oben
        function wortErsetzen() {
            eingabe.value = neuText.value;
            ausgabe.innerHTML = "Der Text oben wurde ersetzt";
        }
        
        // Diese Funktion zeigt die Länge vom Text
        function textLaenge() {
            let text = eingabe.value;
            ausgabe.innerHTML = "Der Text hat " + text.length + " Zeichen";
        }

        // Diese Funktion entfernt alle Leerzeichen
        function leerzeichenEntfernen() {
            let text = eingabe.value;
            let textArray = text.split(" ");
            let neuerText = textArray.concat().join("");

            eingabe.value = neuerText;
            ausgabe.innerHTML = "Alle Leerzeichen wurden entfernt";
        }





    </script>

</body>

</html>
